<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>ArenaVerse</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
<header><div class="logo">ARENA<span>VERSE</span></div><div id="status">ONLINE</div></header>
<section id="home" class="screen">
  <div class="hero"><p class="eyebrow">MULTIPLAYER GAME HUB</p><h1>PLAY. <em>COMPETE.</em> REPLAY.</h1><p>Real rules. Server-validated matches. Challenge friends or play against the computer.</p></div>
  <div class="setup">
    <label>Your name<input id="name" maxlength="18" placeholder="Player"></label>
    <div class="games" id="games"></div>
    <div class="modes"><button data-mode="pvp" class="mode active">PLAYER vs PLAYER</button><button data-mode="pvc" class="mode">PLAYER vs COMPUTER</button></div>
    <div class="room-actions"><button id="create" class="primary">CREATE ROOM</button><input id="roomCode" maxlength="6" placeholder="ROOM CODE"><button id="join">JOIN</button></div>
  </div>
</section>
<section id="lobby" class="screen hidden">
  <div class="panel"><p class="eyebrow">LOBBY</p><h2>Room <span id="code"></span></h2><div id="players"></div><div class="actions"><button id="ready">READY</button><button id="start" class="primary">START MATCH</button></div><p id="lobbyMsg" class="muted"></p><button id="share" class="hidden">SHARE ROOM LINK</button></div>
</section>
<section id="game" class="screen hidden">
  <div class="game-head"><div><p class="eyebrow" id="gameName"></p><h2 id="turnText"></h2></div><button id="leave">LEAVE</button></div>
  <div class="layout"><main id="board" class="board"></main><aside class="panel side"><div id="score"></div><div id="rules"></div><div id="result"></div><button id="rematch" class="primary hidden">PLAY AGAIN</button></aside></div>
</section>
</div>
<script src="/socket.io/socket.io.js"></script><script src="/game.js"></script>
</body></html>
